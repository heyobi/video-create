<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120f12">
<title>FlySoul · Uzun video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1e8; --fg:#1e1b2e; --muted:#6b6478; --card:#ffffff; --line:#e0d9c8;
  --soft:#ece6d8; --accent:#d94a3d; --btn:#1e1b2e; --btnfg:#ffffff; --mark:rgba(255,210,74,.6);
  --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b0e1c; --fg:#efe6d2; --muted:#9d96ab; --card:#141a2e; --line:#262c45;
    --soft:#1b2140; --btn:#e8c36a; --btnfg:#1e1b2e; --mark:rgba(232,195,106,.4); }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);
  border-radius:10px;padding:9px 13px;font-size:14px;font-weight:600;line-height:1.1}
button.main{background:var(--btn);color:var(--btnfg);border-color:transparent}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.stage{position:relative;width:min(100%, calc(62dvh * 16 / 9));aspect-ratio:16/9;margin:0 auto;background:#000;border-radius:14px;overflow:hidden;cursor:pointer;touch-action:manipulation}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.guide{position:absolute;left:2%;top:56%;width:28%;height:42%;border:2px dashed rgba(255,255,255,.75);border-radius:12px;display:none;
  align-items:flex-end;justify-content:center;color:#fff;font-size:12px;padding:6px;text-shadow:0 1px 2px #000;pointer-events:none}
body.guide-on .guide{display:flex}
.pbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.note{color:var(--accent);font-size:14px;margin-bottom:8px}
.txt{font-size:clamp(18px,2.2vw,24px);line-height:1.5}
.txt mark,.full mark{background:linear-gradient(transparent 58%, var(--mark) 58%);color:inherit;font-weight:700}
.pz{color:var(--accent);font-weight:700;margin:0 .15em}
.nextlab{display:inline-block;margin-top:12px;border:1.5px dashed var(--muted);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.full{position:relative;display:none;flex-direction:column;gap:8px;max-height:30dvh;overflow:auto;padding:2px}
@media (max-width:820px){ .full{max-height:48dvh} }
body.fullview .full{display:flex}
body.fullview .pbox{display:none}
.fi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:15px;line-height:1.5}
.fi.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg)}
.fi .note{font-size:12.5px;margin-bottom:4px}
.fi .meta{margin-bottom:2px}
.cleanexit{display:none;position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);z-index:40}
body.clean .wrap{padding:0;max-width:none}
body.clean .pbox,body.clean .tools,body.clean .full{display:none}
body.clean .stage{position:fixed;inset:0;margin:auto;width:min(100vw, calc(100dvh * 16 / 9));border-radius:0}
body.clean{background:#000}
body.clean .guide{display:none}
body.clean.showexit .cleanexit{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="guide">Anlatıcı alanı</div></div>
  <div class="pbox" id="pbox">
    <div class="meta"><span id="mStep"></span><span id="mAuto"></span></div>
    <div class="note" id="pNote"></div>
    <div class="txt" id="pTxt"></div>
    <div class="nextlab" id="pNext"></div>
  </div>
  <div class="full" id="full"></div>
  <div class="tools">
    <button id="bPrev">Önceki adım</button>
    <button class="main" id="bNext">Sonraki</button>
    <button id="bAuto">Otomatik akış: kapalı</button>
    <button id="bFull">Tam metin</button>
    <button id="bGuide">Anlatıcı alanı: gizli</button>
    <button id="bClean">Temiz görüntü</button>
    <button id="bRestart">Baştan</button>
  </div>
</div>
<button class="cleanexit main" id="bCleanExit">Kurgu moduna dön</button>

<script>
'use strict';
const SW = 16, SH = 9, R = 4, DIVE = 3.4;
const NAVY = '#0a1230', GOLD = '#e8c36a', PAPER = '#efe6d2', RED = '#d94a3d', TEAL = '#2c6e6a', INK = '#1e1b2e';
const FONT = '"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const TAU = Math.PI * 2;

const STEPS = [
  [0,'Açılış. Arena ve boss. Merak uyandır.',
   'Bir meyve sineğinin beyni Dark Souls oynayabilir mi? | Bunu gerçekten denedik. | Karşısında oyunun ilk boss\'u var: *Iudex Gundyr*. | Kontrolde ise bir sineğin *beyin haritasından* kurulmuş bir devre.'],
  [1,'Sinek. Bilimsel arka planı ver.',
   'Bu bir meyve sineği: *Drosophila melanogaster*. | Eylül 2026\'da Google Research ve HHMI Janelia, erkek sineğin merkezi sinir sisteminin *tam haritasını* yayımladı.'],
  [2,'Harita. Rakamları yavaş oku.',
   'Haritanın adı *MaleCNS*. | İçinde *166.700* nöron ve *125 milyon* sinaps var. || Hangi hücrenin hangisine bağlandığı tek tek belli.'],
  [2,'Aynı sahne, mantar cisimciğine süzülüyor.',
   'Ama harita bağlantıları veriyor, sinapsların gücünü vermiyor. | O yüzden bu haritadaki hücre tiplerinden *küçük bir devre* kurduk. | Her nöron grubunun ateşleme hızı, dövüş durumlarına göre *ayarlandı*.'],
  [3,'Tek nöron. Elinle voltajın yükselişini çiz.',
   'Devredeki her nöron *biriktir ve ateşle* modeliyle çalışıyor. | Voltaj yavaş yavaş yükselir, eşiği geçince *ateşler*, sonra sıfırlanır. | Sinyal bir sonraki nörona *1,8 milisaniye* gecikmeyle ulaşır.'],
  [4,'Devre akışı. Soldan sağa göster.',
   'Göz, boss\'un yönünü, uzaklığını ve saldırıya hazırlandığını görür. | Sinyal optik lobdan ve merkezi kompleksten geçip *mantar cisimciğine* gelir. | Sonunda *inen nöronlar* sekiz hareketten birini seçer: ilerle, yana kaç, geri çekil, yuvarlan, saldır ya da savuştur.'],
  [5,'Dopamin. İki tonu ayır: sevinç ve acı.',
   'Öğrenme tek bir yerde oluyor: Kenyon hücreleriyle çıkış nöronları arasındaki sinapslarda. | Sinek vurduğunda *PAM* nöronları ödül dopamini salar. | Darbe aldığında *PPL1* nöronları ceza dopamini salar. || Gerçek sinekte de öğrenmenin büyük kısmı burada olur.'],
  [6,'Hata hikâyesi. Dürüst ve biraz esprili.',
   'Bir itirafla devam edelim. | İlk sürümde hareketleri aslında kod seçiyordu, sabit sayılarla. | Ölçünce gördük: *1.024 Kenyon hücresinden hiçbiri* ateşlemiyordu. || Beyin sessizdi, oyunu kod oynuyordu. | O günden beri tek kural var: *kararı devre verir*.'],
  [7,'Sonuç. Rakamlarda dur.',
   'Peki sinek kazanabildi mi? | Yaklaşık *5.200* dövüşte *8 kez* kazandı. | Kabaca her altı yüz dövüşte bir. || Ama asıl sonuç şu: öğrenme eğrisi *düz* kaldı.'],
  [7,'Aynı sahne. Teşhis, sakin ton.',
   'Neden? | Sinyal Kenyon hücrelerinde vardı, sinapslar da onu kısmen taşıyordu. | Ama ağırlıklar birikmedi; her elli dövüşte bir *ters yöne* salındı. || Sinek, fiilen yalnızca son yirmi dövüşünü hatırlıyordu.'],
  [8,'Beyne bir ek. Doruk noktası; kazananın eklenen ağ olduğunu net söyle.',
   'Sineğin beyni yetmedi. | Biz de beynin yanına bir *ek* yaptık: | aynı oyun bilgisini okuyan, beynin *dışında* eğitilen küçük bir yapay ağ. | Sinek devresi çalışmaya devam etti ama kararı artık bu ağ verdi. | Sonuç: son 1.800 dövüşün *yüzde 28 ile 32\'si* zafer. || Yani boss\'u yenen, eklediğimiz ağ oldu.'],
  [8,'Aynı sahne. Sonucu yorumla.',
   'Bu şunu gösteriyor: | aynı bilgiyle oyunu kazanmak mümkün. || Sınır oyun değil, sineğin *öğrenme kuralı*.'],
  [9,'Kapanış sorusu. Yavaşla.',
   'Yani beynin haritası tek başına yetmiyor. || Asıl sır, bir beynin *nasıl öğrendiği*. | Kodun tamamı açık: GitHub\'da heyobi, flysoul.'],
  [0,'Başa dönüş. Gülümse, abone çağrısı.',
   'Belki bir sonraki devre, bu boss\'u gerçekten öğrenerek yener. || Döngü baştan başlar. | Deneyin devamı için kanala abone olmayı unutmayın.'],
].map(([s, note, text]) => {
  const words = text.replace(/\|/g, ' ').replace(/\*/g, '').split(/\s+/).filter(Boolean).length;
  const pauses = (text.match(/\|/g) || []).length;
  return { s, note, text, words, pauses, dur: words * .42 + pauses * .35 + 1.5 };
});

function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function easeIOC(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function mod(n, m) { return ((n % m) + m) % m; }

/* ---------- çizim yardımcıları ---------- */
function T(c, s, x, y, size, col, o = {}) {
  c.save(); c.translate(x, y); c.scale(.01, .01);
  c.font = `${o.w || 600} ${size * 100}px ${FONT}`;
  c.textAlign = o.a || 'left'; c.textBaseline = o.b || 'alphabetic';
  if (o.max) { const m = c.measureText(s).width / 100; if (m > o.max) { const k = o.max / m; c.scale(k, k); } }
  c.fillStyle = col; c.fillText(s, 0, 0); c.restore();
}
function wrap(c, s, size, w, maxW) {
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.font = `${w} ${size * 100}px ${FONT}`;
  const lines = []; let cur = '';
  for (const word of s.split(' ')) { const test = cur ? cur + ' ' + word : word; if (c.measureText(test).width / 100 > maxW && cur) { lines.push(cur); cur = word; } else cur = test; }
  if (cur) lines.push(cur); c.restore(); return lines;
}
function TW(c, s, x, y, size, col, maxW, lh = 1.2, o = {}) {
  const L = wrap(c, s, size, o.w || 600, maxW); L.forEach((l, i) => T(c, l, x, y + i * size * lh, size, col, o)); return L.length;
}
function rrp(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function box(c, x, y, w, h, r, fill, stroke, lw) {
  c.beginPath(); rrp(c, x, y, w, h, r);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || .04; c.stroke(); }
}
function disc(c, x, y, r, fill, stroke, lw) {
  c.beginPath(); c.arc(x, y, r, 0, TAU);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || .04; c.stroke(); }
}
function glow(c, x, y, r, rgb, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}
function lg(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function person(c, x, y, h, col, bob) {
  const yy = y + bob;
  box(c, x - h * .17, yy - h * .62, h * .34, h * .62, h * .12, col);
  disc(c, x, yy - h * .78, h * .14, col);
}
function card(c, x, y, w, h, title, lines) {
  h = 2.6;
  box(c, x + .08, y + .1, w, h, .14, 'rgba(0,0,0,.3)');
  box(c, x, y, w, h, .14, PAPER);
  T(c, title, x + .25, y + .55, .3, INK, { w: 700, max: w - .5 });
  lines.forEach((l, i) => T(c, l, x + .25, y + 1.05 + i * .45, .28, i === lines.length - 1 ? RED : '#3a3448', { w: i === lines.length - 1 ? 700 : 500, max: w - .5 }));
  c.save(); c.translate(x + w - 1.0, y + 2.08); c.rotate(-.18);
  box(c, -.62, -.28, 1.24, .52, .06, null, RED, .05);
  T(c, 'İddia', 0, .1, .3, RED, { w: 700, a: 'center' }); c.restore();
}

let TT = 0;
const osc = k => Math.sin(TAU * k * TT / 60);

/* ---------- sahneler (16x9) ---------- */
const EMBER = '#e07b39', CYAN = '#5ad1e6', GREEN = '#5ee08f', MAG = '#d84fd8', BLOOD = '#c0392b', DIM = 'rgba(239,230,210,.75)';
function arrowR(c, x0, x1, y, col) {
  c.strokeStyle = col; c.lineWidth = .05; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1 - .12, y); c.stroke();
  c.beginPath(); c.moveTo(x1, y); c.lineTo(x1 - .2, y - .14); c.lineTo(x1 - .2, y + .14); c.closePath(); c.fillStyle = col; c.fill();
}
function node(c, x, y, w, h, fill, txt, tc, size) {
  box(c, x - w / 2, y - h / 2, w, h, .16, fill);
  T(c, txt, x, y + size * .35, size, tc, { w: 700, a: 'center', max: w - .2 });
}
function flyTop(c, x, y, s, wingA) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.strokeStyle = '#3a2a1a'; c.lineWidth = .06;
  for (const sd of [-1, 1]) for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(sd * .5, .2 + k * .45); c.quadraticCurveTo(sd * 1.4, -.3 + k * .6, sd * 1.8, .1 + k * .9); c.stroke(); }
  for (const sd of [-1, 1]) { c.save(); c.translate(sd * .3, .5); c.rotate(sd * (.55 + wingA)); c.beginPath(); c.ellipse(sd * .1, 1.6, .7, 1.8, 0, 0, TAU);
    c.fillStyle = 'rgba(210,230,255,.28)'; c.fill(); c.strokeStyle = 'rgba(210,230,255,.55)'; c.lineWidth = .03; c.stroke(); c.restore(); }
  c.beginPath(); c.ellipse(0, 2.2, .8, 1.3, 0, 0, TAU); c.fillStyle = '#c9954f'; c.fill();
  c.save(); c.beginPath(); c.ellipse(0, 2.2, .8, 1.3, 0, 0, TAU); c.clip(); c.fillStyle = '#3a2412';
  for (let k = 0; k < 4; k++) c.fillRect(-1, 1.5 + k * .45, 2, .18); c.restore();
  c.beginPath(); c.ellipse(0, .5, .9, 1.05, 0, 0, TAU); c.fillStyle = '#b98a4e'; c.fill();
  c.beginPath(); c.ellipse(0, -.95, .78, .7, 0, 0, TAU); c.fillStyle = '#a8793e'; c.fill();
  for (const sd of [-1, 1]) { disc(c, sd * .62, -1.0, .44, BLOOD); disc(c, sd * .5, -1.12, .12, 'rgba(255,255,255,.35)'); }
  c.restore();
}
function lockOn(c, x, y, r) {
  glow(c, x, y, r * 2.2, '255,255,255', .18);
  disc(c, x, y, r * 1.24, null, 'rgba(255,255,255,.85)', .04);
  for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + TT * .5; c.beginPath(); c.moveTo(x + r * 1.44 * Math.cos(a), y + r * 1.44 * Math.sin(a)); c.lineTo(x + r * 1.8 * Math.cos(a), y + r * 1.8 * Math.sin(a)); c.strokeStyle = '#fff'; c.lineWidth = .05; c.stroke(); }
}
/* repodaki gerçek görüntüler (heyobi/flysoul) */
const ASSET = '../assets/';
function seq(prefix, n) { const a = []; for (let i = 0; i < n; i++) { const im = new Image(); im.src = ASSET + prefix + String(i).padStart(3, '0') + '.jpg'; a.push(im); } return a; }
const HERO = new Image(); HERO.src = ASSET + 'gundyr_genis.jpg';
const CLIP_V = seq('v_', 64), BRAIN = seq('b_', 21);
const ASSETS_READY = Promise.all([HERO, ...CLIP_V, ...BRAIN].map(im => im.decode().catch(() => {})));
/* oyuncunun kendi kaydından Gundyr karesi, sinematik renk ve kenar karartmasıyla */
function heroShot(c, x, y, w, alpha) {
  const h = w * 360 / 600;
  c.save(); c.globalAlpha = alpha; drawImg(c, HERO, x, y, w, h);
  c.globalCompositeOperation = 'overlay'; c.fillStyle = 'rgba(224,123,57,.45)'; c.fillRect(x, y, w, h);
  c.globalCompositeOperation = 'source-over';
  const v = c.createRadialGradient(x + w * .4, y + h * .35, h * .2, x + w * .5, y + h * .5, w * .6);
  v.addColorStop(0, 'rgba(10,6,6,0)'); v.addColorStop(1, 'rgba(10,6,6,.85)'); c.fillStyle = v; c.fillRect(x, y, w, h);
  c.restore();
  glow(c, x + w * .317, y + h * .09, w * .05, '255,110,40', (.35 + .1 * osc(25)) * alpha);
  return h;
}
/* zafer kaydı, sahneye varıldığı anda baştan başlar ve bir kez oynar */
const victoryFrame = () => CLIP_V[S.si === 8 ? Math.min(63, Math.floor(S.holdT * 8)) : S.si === 7 ? 0 : 63];
const frameOf = (arr, fps) => arr[Math.floor(TT * fps) % arr.length];
/* uyku tekrarı (dreaming) kareleri, ileri geri oynar */
const brainFrame = () => BRAIN[(i => i < 21 ? i : 40 - i)(Math.floor(TT * 8.33) % 40)];
function drawImg(c, im, x, y, w, h) {
  if (im && im.complete && im.naturalWidth) c.drawImage(im, x, y, w, h);
  else { c.fillStyle = '#111'; c.fillRect(x, y, w, h); }
}
function gamePanel(c, im, x, y, w, cap) {
  const h = w * 272 / 480;
  box(c, x - .08, y - .08, w + .16, h + .16, .12, '#000', 'rgba(255,255,255,.35)', .03);
  c.save(); c.beginPath(); rrp(c, x, y, w, h, .08); c.clip(); drawImg(c, im, x, y, w, h); c.restore();
  if (cap) { disc(c, x + .25, y + .3, .08, '#ff3b30'); T(c, cap, x + .42, y + .38, .22, '#fff', { w: 700 }); }
  return h;
}
const SC = [
/* s0 arena */
{ name:'Arena', p:{ k:'c', c:[3.6,0.3], r:0.45 }, draw(c){
  c.fillStyle = '#1a1513'; c.fillRect(-8,-4.5,16,9);
  const x = -.8, y = -3.5, w = 8.8, h = heroShot(c,x,y,w,1);
  c.fillStyle = lg(c,x,0,x+2.4,0,[[0,'#1a1513'],[1,'rgba(26,21,19,0)']]); c.fillRect(x-.01,y,2.4,h);
  c.fillStyle = lg(c,0,y,0,y+1.0,[[0,'#1a1513'],[1,'rgba(26,21,19,0)']]); c.fillRect(x,y-.01,w,1.0);
  c.fillStyle = lg(c,0,y+h*.6,0,y+h,[[0,'rgba(26,21,19,0)'],[1,'#1a1513']]); c.fillRect(x,y+h*.6,w,h*.41);
  for (let i = 0; i < 50; i++) { const yy = 3 - ((TT*.12 + rnd(i)) % 1) * 8; disc(c,-8+rnd(i+9)*16,yy,.03,`rgba(255,150,70,${.3+.4*rnd(i+3)})`); }
  T(c,'Bir sinek beyni',-6.1,-2.6,.75,PAPER,{w:700});
  T(c,'Dark Souls III oynuyor',-6.1,-1.95,.44,EMBER,{w:700,max:5.8});
  T(c,'Karşısında: Iudex Gundyr',-6.1,-1.35,.26,DIM,{w:600});
  T(c,'gerçek oyun kaydından',-6.1,-1.0,.2,DIM,{w:500});

/* ---------- motor ---------- */
const DIAG = Math.hypot(SW / R, SH / R) / 2;
function portalPath(c, p, op) {
  c.beginPath();
  if (p.k === 'c') { c.arc(p.c[0], p.c[1], p.r + (DIAG - p.r) * op, 0, TAU); return; }
  const tw = SW / R, th = SH / R, tx = p.c[0] - tw / 2, ty = p.c[1] - th / 2, L = (a, b) => a + (b - a) * op;
  rrp(c, L(p.x, tx), L(p.y, ty), L(p.w, tw), L(p.h, th), L(p.rr, 0));
}
function renderScene(c, W, H, si, f) {
  const N = SC.length, ppu = Math.min(W / SW, H / SH), z = Math.pow(R, f);
  const pc = SC[si].p.c, k = (1 - Math.pow(R, -f)) / (1 - 1 / R);
  const op = f < .5 ? 0 : smooth((f - .5) / .5);
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  c.save();
  c.translate(W / 2, H / 2); c.scale(ppu * z, ppu * z); c.translate(-pc[0] * k, -pc[1] * k);
  let lvl = si;
  for (let a = 0; a < 2; a++) { const q = SC[mod(lvl - 1, N)].p.c; c.scale(R, R); c.translate(-q[0], -q[1]); lvl = mod(lvl - 1, N); }
  let px = ppu * z * R * R, depth = -2;
  for (let n = 0; n < 9; n++) {
    if (SW * px < 2) break;
    const S = SC[lvl];
    c.save(); c.beginPath(); c.rect(-SW / 2, -SH / 2, SW, SH); c.clip(); S.draw(c); c.restore();
    portalPath(c, S.p, depth < 0 ? 1 : depth === 0 ? op : 0); c.clip();
    c.translate(S.p.c[0], S.p.c[1]); c.scale(1 / R, 1 / R);
    px /= R; lvl = mod(lvl + 1, N); depth++;
  }
  c.restore();
}

function showStep() {
  const st = STEPS[S.step];
  $('mStep').textContent = `Adım ${S.step + 1} / ${STEPS.length} · ${SC[st.s].name}`;
  $('pNote').textContent = st.note; $('pTxt').innerHTML = md(st.text); $('pNext').textContent = nextLabel(S.step);
  FI.forEach((el, i) => el.classList.toggle('on', i === S.step));
  if (document.body.classList.contains('fullview')) centerFull(true);
}
function centerFull(smooth) { const f = $('full'), el = FI[S.step]; f.scrollTo({ top: el.offsetTop - f.clientHeight / 2 + el.offsetHeight / 2, behavior: smooth ? 'smooth' : 'auto' }); }
function jump(n) { S.step = mod(n, STEPS.length); S.si = STEPS[S.step].s; S.f = 0; S.mode = 'hold'; S.holdT = 0; S.stepT = 0; showStep(); }
function next() {
  if (S.mode === 'dive') { S.si = (S.si + 1) % SC.length; S.f = 0; S.mode = 'hold'; S.holdT = 0; }
  const n = (S.step + 1) % STEPS.length, target = STEPS[n].s;
  S.step = n; S.stepT = 0;
  if (target === S.si) {}
  else if (target === (S.si + 1) % SC.length) { S.mode = 'dive'; S.diveT = 0; S.f0 = S.f; }
  else { S.si = target; S.f = 0; S.holdT = 0; }
  showStep();
}
function prev() { jump(S.step - 1); }

let last = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; S.clock += dt;
  if (S.mode === 'dive') {
    S.diveT += dt; const u = S.diveT / DIVE;
    if (u >= 1) { S.si = (S.si + 1) % SC.length; S.f = 0; S.mode = 'hold'; S.holdT = 0; }
    else S.f = S.f0 + (1 - S.f0) * easeIOC(u);
  }
  if (S.mode === 'hold') {
    S.holdT += dt; S.stepT += dt; S.f = .09 * (1 - Math.exp(-S.holdT / 5));
    if (S.auto) { const d = STEPS[S.step].dur; $('mAuto').textContent = 'Otomatik: ' + fmt(Math.max(0, d - S.stepT)) + ' sn'; if (S.stepT >= d) next(); }
  }
  TT = S.clock;
  renderScene(ctx, cv.width, cv.height, S.si, S.f);
  requestAnimationFrame(frame);
}

$('bNext').onclick = next; $('bPrev').onclick = prev; $('bRestart').onclick = () => jump(0);
stage.addEventListener('click', next);
$('bAuto').onclick = () => { S.auto = !S.auto; S.stepT = 0; $('bAuto').textContent = 'Otomatik akış: ' + (S.auto ? 'açık' : 'kapalı'); $('mAuto').textContent = ''; };
$('bFull').onclick = () => { const on = document.body.classList.toggle('fullview'); $('bFull').textContent = on ? 'Adım görünümü' : 'Tam metin'; if (on) centerFull(false); };
$('bGuide').onclick = () => { const on = document.body.classList.toggle('guide-on'); $('bGuide').textContent = 'Anlatıcı alanı: ' + (on ? 'görünür' : 'gizli'); };
$('bClean').onclick = () => { S.clean = true; document.body.classList.add('clean'); flashExit(); };
$('bCleanExit').onclick = e => { e.stopPropagation(); exitClean(); };
function exitClean() { S.clean = false; document.body.classList.remove('clean', 'showexit'); }
function flashExit() { if (!S.clean) return; document.body.classList.add('showexit'); clearTimeout(flashExit.h); flashExit.h = setTimeout(() => document.body.classList.remove('showexit'), 2500); }
['mousemove', 'touchstart'].forEach(ev => window.addEventListener(ev, flashExit, { passive: true }));
window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'c' || e.key === 'C') { if (S.clean) exitClean(); }
});

window.DONGU_UZUN = { ready: ASSETS_READY, SC, STEPS, renderScene, state: S, jump, next };
resize(); showStep(); requestAnimationFrame(frame);
</script>
