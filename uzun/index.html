<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1230">
<title>Fon Krizi · Uzun video kurgusu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1e8; --fg:#1e1b2e; --muted:#6b6478; --card:#ffffff; --line:#e0d9c8;
  --soft:#ece6d8; --accent:#d94a3d; --btn:#1e1b2e; --btnfg:#ffffff; --mark:rgba(255,210,74,.6);
  --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b0e1c; --fg:#efe6d2; --muted:#9d96ab; --card:#141a2e; --line:#262c45;
    --soft:#1b2140; --btn:#e8c36a; --btnfg:#1e1b2e; --mark:rgba(232,195,106,.4); }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);
  border-radius:10px;padding:9px 13px;font-size:14px;font-weight:600;line-height:1.1}
button.main{background:var(--btn);color:var(--btnfg);border-color:transparent}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.stage{position:relative;width:min(100%, calc(62dvh * 16 / 9));aspect-ratio:16/9;margin:0 auto;background:#000;border-radius:14px;overflow:hidden;cursor:pointer;touch-action:manipulation}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.guide{position:absolute;left:2%;top:56%;width:28%;height:42%;border:2px dashed rgba(255,255,255,.75);border-radius:12px;display:none;
  align-items:flex-end;justify-content:center;color:#fff;font-size:12px;padding:6px;text-shadow:0 1px 2px #000;pointer-events:none}
body.guide-on .guide{display:flex}
.pbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.note{color:var(--accent);font-size:14px;margin-bottom:8px}
.txt{font-size:clamp(18px,2.2vw,24px);line-height:1.5}
.txt mark,.full mark{background:linear-gradient(transparent 58%, var(--mark) 58%);color:inherit;font-weight:700}
.pz{color:var(--accent);font-weight:700;margin:0 .15em}
.nextlab{display:inline-block;margin-top:12px;border:1.5px dashed var(--muted);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.full{position:relative;display:none;flex-direction:column;gap:8px;max-height:30dvh;overflow:auto;padding:2px}
@media (max-width:820px){ .full{max-height:48dvh} }
body.fullview .full{display:flex}
body.fullview .pbox{display:none}
.fi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:15px;line-height:1.5}
.fi.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg)}
.fi .note{font-size:12.5px;margin-bottom:4px}
.fi .meta{margin-bottom:2px}
.cleanexit{display:none;position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);z-index:40}
body.clean .wrap{padding:0;max-width:none}
body.clean .pbox,body.clean .tools,body.clean .full{display:none}
body.clean .stage{position:fixed;inset:0;margin:auto;width:min(100vw, calc(100dvh * 16 / 9));border-radius:0}
body.clean{background:#000}
body.clean .guide{display:none}
body.clean.showexit .cleanexit{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="guide">Anlatıcı alanı</div></div>
  <div class="pbox" id="pbox">
    <div class="meta"><span id="mStep"></span><span id="mAuto"></span></div>
    <div class="note" id="pNote"></div>
    <div class="txt" id="pTxt"></div>
    <div class="nextlab" id="pNext"></div>
  </div>
  <div class="full" id="full"></div>
  <div class="tools">
    <button id="bPrev">Önceki adım</button>
    <button class="main" id="bNext">Sonraki</button>
    <button id="bAuto">Otomatik akış: kapalı</button>
    <button id="bFull">Tam metin</button>
    <button id="bGuide">Anlatıcı alanı: gizli</button>
    <button id="bClean">Temiz görüntü</button>
    <button id="bRestart">Baştan</button>
  </div>
</div>
<button class="cleanexit main" id="bCleanExit">Kurgu moduna dön</button>

<script>
'use strict';
const SW = 16, SH = 9, R = 4, DIVE = 3.4;
const NAVY = '#0a1230', GOLD = '#e8c36a', PAPER = '#efe6d2', RED = '#d94a3d', TEAL = '#2c6e6a', INK = '#1e1b2e';
const FONT = '"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const TAU = Math.PI * 2;

const STEPS = [
  [0,'Açılış. Ekranda \'524 kat\' yazısı ve yükselen grafik. Kameraya dön, merak uyandıran sakin bir tonla başla.',
   'Bir fon düşünün. | TEFAS verisine göre TLY fonu 2021\'den bu yana *524 kat* büyüdü. | 1 milyon lira koyan, Ağustos 2026\'da kâğıt üzerinde *524 milyon* görüyordu. || Sonra bir sabah kimse parasını çekemedi. | Nasıl oldu? İçeri girelim.'],
  [1,'Döngü şeması. Çarkı elinle havada çiziyormuş gibi anlat.',
   'Mekanizma aslında bir *döngü*. | Fonlar az işlem gören, bir kısmı kendi gruplarına bağlı hisseleri aldı. | Hisse *aralarında el değiştirdikçe* fiyat şişti, fon kâr ediyormuş gibi göründü. | Parlayan getiriyi gören yeni yatırımcı geldi, gelen para yine *aynı hisselere* gitti.'],
  [1,'Aynı sahne, görüntü yavaşça üst kutuya süzülüyor. Tonu düşür, uyarı gibi söyle.',
   'Bu çark sadece para girerken döner. || Herkes aynı anda çıkmak isterse *tersine* döner: | fon hisseyi satar, fiyat düşer, fon değer kaybeder, | daha çok kişi çıkmak ister.'],
  [2,'Bina sahnesi. Vitrini göster.',
   'Anahtar kavram: *fiili dolaşım*. | Şirketin paylarının sadece küçük bir kısmı borsada gerçekten el değiştiriyor. | Az pay, çok talep olunca fiyat kolayca uçuyor. || Ama satmak istediğinizde karşınızda *alıcı yok*.'],
  [3,'Zaman çizelgesi. Tarihleri soldan sağa okur gibi.',
   'Takvim şöyle işledi. | *Haziranda* MSCI, küçük hisselerde fonlarla bağlantılı koordineli işlem kaygısını dile getirdi. | *28 Ağustos\'ta* SPK yoğunlaşmış pozisyonlara sınır koydu. | Eylül başında küçük hisselerde satış baskısı başladı.'],
  [3,'Aynı sahne, kırmızı \'15 Eylül\' sayfasına süzülüyor. Hızlan, gerilimi artır.',
   '*15 Eylül\'de* Pusula Portföy\'ün bazı fonları yatırımcıya ödeme yapamadı. | Ertesi gün Tera\'nın iki fonunda aynı sorun. | *17 Eylül\'de* SPK yedi portföy şirketinin fonlarını işleme kapattı.'],
  [4,'Kasa kapısı. Rakamı söylerken dur.',
   'Tasfiyedeki fonların büyüklüğü yaklaşık || *826 milyar lira*. | SPK\'ya göre içeride *455 binden fazla* yatırımcı var. | Paralarının ne kadarının döneceği, o hisselerin hangi fiyattan satılabileceğine bağlı.'],
  [5,'Adliye. Resmi, net ton. Kaynağı mutlaka söyle.',
   'Sonra savcılık devreye girdi. | Adalet Bakanı Akın Gürlek\'in 26 Eylül açıklamasına göre *45 kişi tutuklandı*. | 42 kişinin, 46 şirketin ve 18 fonun mal varlığı donduruldu. | Sonraki kararlarla tutuklu sayısı *51\'e* çıktı.'],
  [6,'Gemi ve fiyat grafiği. Kısa bir sessizlik bırak, sonra \'iddia\' kelimesini net vurgula.',
   'Şimdi işin siyasi tarafı. || Krizde adı en çok geçen hisselerden biri *Özata Denizcilik*. | Yeni Parti Sözcüsü Zeynel Emre\'nin *iddiasına göre* eski Aile ve Sosyal Politikalar Bakanı Fatma Betül Sayan Kaya bu hisseyi nisanda yaklaşık *255 liradan* aldı, | eylülde yaklaşık *4 bin 482 liradan* sattı.'],
  [7,'Boş koltuk, isimlik, iddia kartları. Rakamları yavaş oku.',
   'İddiadaki rakamlar şöyle: | Kaya yaklaşık 63 milyon lira yatırıp *1 milyar 344 milyon* lira çekti. | Eşi İlyas Kaya 99,7 milyon yatırıp *826 milyon* çekti. | Toplam 2 milyar liranın üzerinde. || Emre\'ye göre satışlar, soruşturmanın kamuoyuna yansıdığı *16 Eylül\'den hemen önce* yapıldı.'],
  [7,'Aynı sahne, saate süzülüyor. Denge cümlesi, atlama; hukuken seni korur.',
   'Adil olalım: bunlar şimdilik *iddia*. | Kaya iddiaları doğrudan yalanlamadı ama AK Parti Genel Başkan Yardımcılığı\'ndan istifa etti, istifası kabul edildi. | SPK\'nın Özata için açıkladığı yasaklı isimler listesinde çiftin adı yok. | Savcılık ise mal varlıklarına tedbir talep etti. | Basına yansıyan haberlere göre SPK da çift hakkında suç duyurusuna hazırlanıyor.'],
  [8,'Meclis, iki balon. İki tarafı eşit tonda aktar.',
   'Siyaset ikiye bölündü. | AK Parti Sözcüsü Ömer Çelik, sorumluluğu olan kim varsa *hesap sorulacağını* söyledi. | Muhalefet ise SPK\'nın ve Bakan Şimşek\'in şüpheli işlemlerden *aylar önce* haberdar olduğunu, buna rağmen durdurulmadığını öne sürüyor.'],
  [9,'Kum saati. Yavaşla, soruyu izleyiciye bırak.',
   'Tasfiyenin en fazla *üç ay* sürmesi öngörülüyor. || Asıl soru hâlâ cevapsız: | *826 milyar liranın ne kadarı yatırımcıya geri dönecek?*'],
  [0,'Kapanış, başa dönüş. Gülümse, abone çağrısı.',
   'Belki de hikâye burada bitmiyor. | Başka bir fon, başka bir grafik, *aynı çark*. || Döngü baştan başlar. | Gelişmeleri takip edeceğim, kanala abone olmayı unutmayın.'],
].map(([s, note, text]) => {
  const words = text.replace(/\|/g, ' ').replace(/\*/g, '').split(/\s+/).filter(Boolean).length;
  const pauses = (text.match(/\|/g) || []).length;
  return { s, note, text, words, pauses, dur: words * .42 + pauses * .35 + 1.5 };
});

function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function easeIOC(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function mod(n, m) { return ((n % m) + m) % m; }

/* ---------- çizim yardımcıları ---------- */
function T(c, s, x, y, size, col, o = {}) {
  c.save(); c.translate(x, y); c.scale(.01, .01);
  c.font = `${o.w || 600} ${size * 100}px ${FONT}`;
  c.textAlign = o.a || 'left'; c.textBaseline = o.b || 'alphabetic';
  if (o.max) { const m = c.measureText(s).width / 100; if (m > o.max) { const k = o.max / m; c.scale(k, k); } }
  c.fillStyle = col; c.fillText(s, 0, 0); c.restore();
}
function wrap(c, s, size, w, maxW) {
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.font = `${w} ${size * 100}px ${FONT}`;
  const lines = []; let cur = '';
  for (const word of s.split(' ')) { const test = cur ? cur + ' ' + word : word; if (c.measureText(test).width / 100 > maxW && cur) { lines.push(cur); cur = word; } else cur = test; }
  if (cur) lines.push(cur); c.restore(); return lines;
}
function TW(c, s, x, y, size, col, maxW, lh = 1.2, o = {}) {
  const L = wrap(c, s, size, o.w || 600, maxW); L.forEach((l, i) => T(c, l, x, y + i * size * lh, size, col, o)); return L.length;
}
function rrp(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function box(c, x, y, w, h, r, fill, stroke, lw) {
  c.beginPath(); rrp(c, x, y, w, h, r);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || .04; c.stroke(); }
}
function disc(c, x, y, r, fill, stroke, lw) {
  c.beginPath(); c.arc(x, y, r, 0, TAU);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || .04; c.stroke(); }
}
function glow(c, x, y, r, rgb, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}
function lg(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function person(c, x, y, h, col, bob) {
  const yy = y + bob;
  box(c, x - h * .17, yy - h * .62, h * .34, h * .62, h * .12, col);
  disc(c, x, yy - h * .78, h * .14, col);
}
function card(c, x, y, w, h, title, lines) {
  h = 2.6;
  box(c, x + .08, y + .1, w, h, .14, 'rgba(0,0,0,.3)');
  box(c, x, y, w, h, .14, PAPER);
  T(c, title, x + .25, y + .55, .3, INK, { w: 700, max: w - .5 });
  lines.forEach((l, i) => T(c, l, x + .25, y + 1.05 + i * .45, .28, i === lines.length - 1 ? RED : '#3a3448', { w: i === lines.length - 1 ? 700 : 500, max: w - .5 }));
  c.save(); c.translate(x + w - 1.0, y + 2.08); c.rotate(-.18);
  box(c, -.62, -.28, 1.24, .52, .06, null, RED, .05);
  T(c, 'İddia', 0, .1, .3, RED, { w: 700, a: 'center' }); c.restore();
}

let TT = 0;
const osc = k => Math.sin(TAU * k * TT / 60);

/* ---------- sahneler (16x9) ---------- */
const SC = [
/* s0 açılış */
{ name:'Açılış', p:{ k:'c', c:[2.75,-3.0], r:0.38 }, draw(c){
  c.fillStyle = NAVY; c.fillRect(-8,-4.5,16,9);
  c.strokeStyle = 'rgba(232,195,106,.07)'; c.lineWidth = .02; c.beginPath();
  for (let x = -8; x <= 8; x += .75) { c.moveTo(x,-4.5); c.lineTo(x,4.5); }
  for (let y = -4.5; y <= 4.5; y += .75) { c.moveTo(-8,y); c.lineTo(8,y); } c.stroke();
  T(c,'Bir fon, beş yıl',-6.1,-2.75,.45,PAPER);
  T(c,'524 kat',-6.2,-1.1,1.8,GOLD,{w:700,max:7});
  T(c,'1 milyon TL, kâğıt üzerinde 524 milyon',-6.1,-.45,.36,PAPER,{w:500,max:7.4});
  T(c,'TLY fonu, 2021 ile Ağustos 2026 arası',-6.1,-.02,.25,'rgba(239,230,210,.62)',{w:400});
  box(c,1.9,-3.95,4.6,7.9,.55,'#0b0d18','#3b4470',.07);
  box(c,2.12,-3.7,4.16,7.4,.35,lg(c,0,-3.7,0,3.7,[[0,'#18234f'],[1,'#0a1230']]));
  box(c,3.65,-3.6,1.1,.15,.07,'#05060c');
  c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = .02; c.beginPath();
  for (let y = -1.2; y <= 3.1; y += 1.07) { c.moveTo(2.35,y); c.lineTo(6.05,y); } c.stroke();
  const pts = []; for (let i = 0; i <= 60; i++) { const u = i/60; pts.push([2.4+u*3.6, 3.1-4.3*(Math.exp(4.2*u)-1)/(Math.exp(4.2)-1)]); }
  c.beginPath(); c.moveTo(2.4,3.1); pts.forEach(p => c.lineTo(p[0],p[1])); c.lineTo(6.0,3.1); c.closePath();
  c.fillStyle = lg(c,0,-1.2,0,3.1,[[0,'rgba(232,195,106,.55)'],[1,'rgba(232,195,106,0)']]); c.fill();
  c.beginPath(); pts.forEach((p,i) => i ? c.lineTo(p[0],p[1]) : c.moveTo(p[0],p[1]));
  c.strokeStyle = GOLD; c.lineWidth = .08; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke();
  T(c,'2021',2.4,3.45,.22,'rgba(239,230,210,.6)',{w:500});
  T(c,'2026',6.0,3.45,.22,'rgba(239,230,210,.6)',{w:500,a:'right'});
  glow(c,6.0,-1.2,.7,'232,195,106',.5+.15*osc(30)); disc(c,6.0,-1.2,.11,'#fff0b8');
  T(c,'TLY',3.35,-2.83,.5,PAPER,{w:700});
  T(c,'+%52.300',2.4,-2.05,.38,'#5ee08f',{w:700});
  T(c,'5 yıl',6.0,-2.83,.24,'rgba(239,230,210,.55)',{w:500,a:'right'});
  glow(c,2.75,-3.0,1.0,'232,195,106',.4+.12*osc(30));
  disc(c,2.75,-3.0,.47,lg(c,2.28,-3.47,3.22,-2.53,[[0,'#fff0b8'],[.5,GOLD],[1,'#a57a26']]));
  disc(c,2.75,-3.0,.38,'#f1d489','#b88c32',.03);
  T(c,'₺',2.75,-2.85,.4,'#a57a26',{w:700,a:'center'});
}},
/* s1 döngü */
{ name:'Döngü', p:{ k:'r', c:[1,-2.55], x:0.15, y:-3.05, w:1.7, h:1.0, rr:.14 }, draw(c){
  c.fillStyle = PAPER; c.fillRect(-8,-4.5,16,9);
  c.fillStyle = 'rgba(30,27,46,.05)'; for (let i = 0; i < 160; i++) { c.beginPath(); c.arc(-8+rnd(i)*16,-4.5+rnd(i+500)*9,.03,0,TAU); c.fill(); }
  T(c,'Döngü',-6.1,-2.55,.95,INK,{w:700});
  T(c,'Aynı hisse,',-6.1,-1.85,.34,'#5a5266',{w:500}); T(c,'aynı eller arasında',-6.1,-1.43,.34,'#5a5266',{w:500});
  const cx = 1, cy = -.1, rx = 4.0, ry = 2.45;
  c.setLineDash([.25,.18]); c.lineDashOffset = -TT*.5;
  c.beginPath(); c.ellipse(cx,cy,rx,ry,0,0,TAU); c.strokeStyle = 'rgba(30,27,46,.55)'; c.lineWidth = .06; c.stroke();
  c.setLineDash([]); c.lineDashOffset = 0;
  for (const a of [Math.PI/4, 3*Math.PI/4, 5*Math.PI/4, 7*Math.PI/4]) {
    const px = cx+rx*Math.cos(a), py = cy+ry*Math.sin(a); let dx = -rx*Math.sin(a), dy = ry*Math.cos(a); const l = Math.hypot(dx,dy); dx /= l; dy /= l;
    c.beginPath(); c.moveTo(px+dx*.32,py+dy*.32); c.lineTo(px-dx*.12-dy*.2,py-dy*.12+dx*.2); c.lineTo(px-dx*.12+dy*.2,py-dy*.12-dx*.2); c.closePath(); c.fillStyle = INK; c.fill();
  }
  for (let k = 0; k < 3; k++) { const a = TAU*(TT/6 + k/3); disc(c,cx+rx*Math.cos(a),cy+ry*Math.sin(a),.15,GOLD,'#a57a26',.03); }
  T(c,'Az işlem gören hisse',1,-3.3,.3,INK,{w:700,a:'center'});
  box(c,.03,-3.17,1.94,1.24,.2,INK);
  box(c,.15,-3.05,1.7,1.0,.14,'#2a2740');
  for (let i = 0; i < 5; i++) { const h = .2+rnd(i+9)*.4; box(c,.3+i*.3,-2.15-h,.12,h,.02,i%2?RED:TEAL); }
  box(c,3.5,-.7,3.0,1.2,.18,GOLD);

  c.beginPath();
  if (p.k === 'c') { c.arc(p.c[0], p.c[1], p.r + (DIAG - p.r) * op, 0, TAU); return; }
  const tw = SW / R, th = SH / R, tx = p.c[0] - tw / 2, ty = p.c[1] - th / 2, L = (a, b) => a + (b - a) * op;
  rrp(c, L(p.x, tx), L(p.y, ty), L(p.w, tw), L(p.h, th), L(p.rr, 0));
}
function renderScene(c, W, H, si, f) {
  const N = SC.length, ppu = Math.min(W / SW, H / SH), z = Math.pow(R, f);
  const pc = SC[si].p.c, k = (1 - Math.pow(R, -f)) / (1 - 1 / R);
  const op = f < .5 ? 0 : smooth((f - .5) / .5);
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  c.save();
  c.translate(W / 2, H / 2); c.scale(ppu * z, ppu * z); c.translate(-pc[0] * k, -pc[1] * k);
  let lvl = si;
  for (let a = 0; a < 2; a++) { const q = SC[mod(lvl - 1, N)].p.c; c.scale(R, R); c.translate(-q[0], -q[1]); lvl = mod(lvl - 1, N); }
  let px = ppu * z * R * R, depth = -2;
  for (let n = 0; n < 9; n++) {
    if (SW * px < 2) break;
    const S = SC[lvl];
    c.save(); c.beginPath(); c.rect(-SW / 2, -SH / 2, SW, SH); c.clip(); S.draw(c); c.restore();
    portalPath(c, S.p, depth < 0 ? 1 : depth === 0 ? op : 0); c.clip();
    c.translate(S.p.c[0], S.p.c[1]); c.scale(1 / R, 1 / R);
    px /= R; lvl = mod(lvl + 1, N); depth++;
  }
  c.restore();
}

/* ---------- durum ---------- */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
const S = { step: 0, si: 0, f: 0, mode: 'hold', holdT: 0, stepT: 0, diveT: 0, f0: 0, auto: false, clean: false, clock: 0 };
function resize() { const r = stage.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2.5); cv.width = Math.max(2, Math.round(r.width * d)); cv.height = Math.max(2, Math.round(r.height * d)); }
new ResizeObserver(resize).observe(stage);

function esc(s) { return s.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
function md(s) { return esc(s).replace(/\*(.+?)\*/g, '<mark>$1</mark>').replace(/\s*\|\|\s*/g, ' <span class="pz">‖‖</span> ').replace(/\s*\|\s*/g, ' <span class="pz">‖</span> '); }
function nextLabel(n) {
  if (n === STEPS.length - 1) return 'Boşluk: senaryonun başına dön (aynı sahne)';
  const a = STEPS[n].s, b = STEPS[n + 1].s;
  return a === b ? 'Boşluk: aynı sahnede devam' : 'Boşluk: ' + SC[b].name + ' sahnesine dal';
}
function fmt(x) { return x.toFixed(1).replace('.', ','); }

$('full').innerHTML = STEPS.map((st, i) => `<div class="fi" data-i="${i}"><div class="meta"><span>${i + 1}. ${SC[st.s].name}</span><span>yaklaşık ${fmt(st.dur)} sn</span></div><div class="note">${esc(st.note)}</div><div>${md(st.text)}</div></div>`).join('');
const FI = [...document.querySelectorAll('.fi')];
FI.forEach(el => el.addEventListener('click', () => jump(+el.dataset.i)));

function showStep() {
  const st = STEPS[S.step];
  $('mStep').textContent = `Adım ${S.step + 1} / ${STEPS.length} · ${SC[st.s].name}`;
  $('pNote').textContent = st.note; $('pTxt').innerHTML = md(st.text); $('pNext').textContent = nextLabel(S.step);
  FI.forEach((el, i) => el.classList.toggle('on', i === S.step));
  if (document.body.classList.contains('fullview')) centerFull(true);
}
function centerFull(smooth) { const f = $('full'), el = FI[S.step]; f.scrollTo({ top: el.offsetTop - f.clientHeight / 2 + el.offsetHeight / 2, behavior: smooth ? 'smooth' : 'auto' }); }
function jump(n) { S.step = mod(n, STEPS.length); S.si = STEPS[S.step].s; S.f = 0; S.mode = 'hold'; S.holdT = 0; S.stepT = 0; showStep(); }
function next() {
  if (S.mode === 'dive') { S.si = (S.si + 1) % SC.length; S.f = 0; S.mode = 'hold'; S.holdT = 0; }
  const n = (S.step + 1) % STEPS.length, target = STEPS[n].s;
  S.step = n; S.stepT = 0;
  if (target === S.si) {}
  else if (target === (S.si + 1) % SC.length) { S.mode = 'dive'; S.diveT = 0; S.f0 = S.f; }
  else { S.si = target; S.f = 0; S.holdT = 0; }
  showStep();
}
function prev() { jump(S.step - 1); }

let last = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; S.clock += dt;
  if (S.mode === 'dive') {
    S.diveT += dt; const u = S.diveT / DIVE;
    if (u >= 1) { S.si = (S.si + 1) % SC.length; S.f = 0; S.mode = 'hold'; S.holdT = 0; }
    else S.f = S.f0 + (1 - S.f0) * easeIOC(u);
  }
  if (S.mode === 'hold') {
    S.holdT += dt; S.stepT += dt; S.f = .09 * (1 - Math.exp(-S.holdT / 5));
    if (S.auto) { const d = STEPS[S.step].dur; $('mAuto').textContent = 'Otomatik: ' + fmt(Math.max(0, d - S.stepT)) + ' sn'; if (S.stepT >= d) next(); }
  }
  TT = S.clock;
  renderScene(ctx, cv.width, cv.height, S.si, S.f);
  requestAnimationFrame(frame);
}

$('bNext').onclick = next; $('bPrev').onclick = prev; $('bRestart').onclick = () => jump(0);
stage.addEventListener('click', next);
$('bAuto').onclick = () => { S.auto = !S.auto; S.stepT = 0; $('bAuto').textContent = 'Otomatik akış: ' + (S.auto ? 'açık' : 'kapalı'); $('mAuto').textContent = ''; };
$('bFull').onclick = () => { const on = document.body.classList.toggle('fullview'); $('bFull').textContent = on ? 'Adım görünümü' : 'Tam metin'; if (on) centerFull(false); };
$('bGuide').onclick = () => { const on = document.body.classList.toggle('guide-on'); $('bGuide').textContent = 'Anlatıcı alanı: ' + (on ? 'görünür' : 'gizli'); };
$('bClean').onclick = () => { S.clean = true; document.body.classList.add('clean'); flashExit(); };
$('bCleanExit').onclick = e => { e.stopPropagation(); exitClean(); };
function exitClean() { S.clean = false; document.body.classList.remove('clean', 'showexit'); }
function flashExit() { if (!S.clean) return; document.body.classList.add('showexit'); clearTimeout(flashExit.h); flashExit.h = setTimeout(() => document.body.classList.remove('showexit'), 2500); }
['mousemove', 'touchstart'].forEach(ev => window.addEventListener(ev, flashExit, { passive: true }));
window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'c' || e.key === 'C') { if (S.clean) exitClean(); }
});

window.DONGU_UZUN = { SC, STEPS, renderScene, state: S, jump, next };
resize(); showStep(); requestAnimationFrame(frame);
</script>
</body>
</html>
